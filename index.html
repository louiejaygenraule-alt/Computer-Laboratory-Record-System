<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Laboratory Record System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

header {
    background: #17365d;
    color: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px #ddd;
}

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.stat {
    flex: 1;
    min-width: 150px;
    background: #e8eef7;
    padding: 15px;
    border-radius: 8px;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

input {
    width: 100%;
}

button {
    background: #17365d;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.delete {
    background: #c0392b;
}

.timeout {
    background: #16834a;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    min-width: 850px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
    font-size: 13px;
}

th {
    background: #17365d;
    color: white;
}

.table-wrap {
    overflow-x: auto;
}

@media print {
    button, input, .form-card {
        display: none !important;
    }
    body {
        background: white;
    }
}
</style>
</head>

<body>
<div class="container">

<header>
    <h2>Computer Laboratory Record System</h2>
    <p>Student Computer Laboratory Monitoring</p>
</header>

<div class="card">
    <h3>Dashboard</h3>
    <div class="stats">
        <div class="stat">
            <h4>Total Records</h4>
            <h2 id="total">0</h2>
        </div>
        <div class="stat">
            <h4>Currently Inside</h4>
            <h2 id="inside">0</h2>
        </div>
        <div class="stat">
            <h4>Completed Visits</h4>
            <h2 id="completed">0</h2>
        </div>
    </div>
</div>

<div class="card form-card">
    <h3>Add Student Record</h3>

    <form id="recordForm">
        <label>Student ID</label>
        <input id="studentId" required placeholder="Enter Student ID">

        <label>Student Name</label>
        <input id="studentName" required placeholder="Enter Full Name">

        <label>Course / Section</label>
        <input id="course" required placeholder="Enter Course or Section">

        <label>Purpose</label>
        <input id="purpose" required placeholder="Enter Purpose">

        <label>Computer Number</label>
        <input id="computer" required placeholder="Example: PC-01">

        <button type="submit">Time In / Save Record</button>
    </form>
</div>

<div class="card">
    <h3>Student Records</h3>

    <input id="search" placeholder="Search by Student ID or Name..."
    oninput="displayRecords()">

    <button onclick="window.print()">Print Records</button>
    <button onclick="exportCSV()">Export CSV</button>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Course / Section</th>
                    <th>Purpose</th>
                    <th>Computer</th>
                    <th>Time-In</th>
                    <th>Time-Out</th>
                    <th>Status / Action</th>
                </tr>
            </thead>
            <tbody id="recordTable"></tbody>
        </table>
    </div>
</div>

</div>

<script>
let records = JSON.parse(
    localStorage.getItem("comlabRecords") || "[]"
);

function saveRecords() {
    localStorage.setItem(
        "comlabRecords",
        JSON.stringify(records)
    );
}

function updateDashboard() {
    document.getElementById("total").textContent =
        records.length;

    document.getElementById("inside").textContent =
        records.filter(r => !r.timeOut).length;

    document.getElementById("completed").textContent =
        records.filter(r => r.timeOut).length;
}

document.getElementById("recordForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const record = {
        id: Date.now(),
        studentId: document.getElementById("studentId").value.trim(),
        name: document.getElementById("studentName").value.trim(),
        course: document.getElementById("course").value.trim(),
        purpose: document.getElementById("purpose").value.trim(),
        computer: document.getElementById("computer").value.trim(),
        timeIn: new Date().toLocaleString(),
        timeOut: ""
    };

    records.push(record);
    saveRecords();
    displayRecords();

    this.reset();
    alert("Student record saved successfully!");
});

function timeOut(id) {
    const record = records.find(r => r.id === id);

    if (!record || record.timeOut) return;

    record.timeOut = new Date().toLocaleString();

    saveRecords();
    displayRecords();

    alert("Time-Out recorded successfully!");
}

function deleteRecord(id) {
    if (!confirm("Are you sure you want to delete this record?")) {
        return;
    }

    records = records.filter(r => r.id !== id);

    saveRecords();
    displayRecords();
}

function displayRecords() {
    const table = document.getElementById("recordTable");
    const search = document.getElementById("search")
        .value.toLowerCase();

    table.innerHTML = "";

    const filtered = records.filter(r =>
        r.name.toLowerCase().includes(search) ||
        r.studentId.toLowerCase().includes(search)
    );

    filtered.forEach(r => {
        const row = document.createElement("tr");

        [
            r.studentId,
            r.name,
            r.course,
            r.purpose,
            r.computer,
            r.timeIn,
            r.timeOut || "Not yet",
        ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const action = document.createElement("td");

        if (!r.timeOut) {
            const outButton = document.createElement("button");
            outButton.textContent = "Time-Out";
            outButton.className = "timeout";
            outButton.onclick = () => timeOut(r.id);
            action.appendChild(outButton);
        } else {
            action.textContent = "Completed";
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.onclick = () => deleteRecord(r.id);

        action.appendChild(deleteButton);
        row.appendChild(action);
        table.appendChild(row);
    });

    updateDashboard();
}

function exportCSV() {
    const headings = [
        "Student ID", "Name", "Course/Section",
        "Purpose", "Computer", "Time-In", "Time-Out"
    ];

    const rows = records.map(r => [
        r.studentId, r.name, r.course, r.purpose,
        r.computer, r.timeIn, r.timeOut
    ]);

    const csv = [headings, ...rows]
        .map(row => row.map(value =>
            '"' + String(value).replace(/"/g, '""') + '"'
        ).join(","))
        .join("\n");

    const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Computer_Laboratory_Records.csv";
    link.click();

    URL.revokeObjectURL(link.href);
}

displayRecords();
</script>

</body>
</html>
